schema_version: p3.0
data_product: worldlong_valid_v1
data_stage: candidate
release_profile_id: p3-probe-12-v1
n_worlds: 20
target_promoted_worlds: 12
n_parallel: 2
n_pulses: 0
# CodeForge only: linked dependency/review/CI/license/integration streams inside
# the focal repo. These are executable workflow history, not packing filler.
n_workstreams: 36
n_anchors: 0
# P3 context is built only from replayable workflow history. Unbound reference
# documents are not counted as release data or used to inflate token length.
n_source_pack: 0
extra_filler_worlds: 0
min_semantic_tokens: 800
train_ratio: 0.75
surface_min: 0.82
keep_one_position: true
# The first release is an explicitly scoped CodeForge probe. Other executable
# domains remain separate synthetic curricula until they have equally strict
# long-lived workflows and source-specific ingestion.
domains: [codeforge]
include_program_joins: false

# Seed 2 will replay only the freshly exported v2 bundle. The path intentionally
# stays absent until the legacy 80-episode bundle has been re-exported under the
# current source/scanner/policy contract; generation therefore fails closed.
real_workflow_bundle: configs/public_repo_episodes_v2.json
real_workflow_seeds: [2]
real_workflow_query_types:
  [
    version_selection,
    ci_regression_origin,
    license_compatibility,
    cross_repo_release_dependency,
  ]
real_workflow_length_buckets: [16k, 32k, 64k]
real_workflow_query_length_buckets:
  version_selection: [16k, 32k, 64k]
  ci_regression_origin: [16k]
  license_compatibility: [16k]
  cross_repo_release_dependency: [32k]
real_workflow_views: [full, cf, ordered_artifact_view]
exact_tokenizer:
  model_id: Qwen/Qwen3.5-4B
  revision: a7b0d22b993d71000cf2eadfb37222a67cee521e
  local_files_only: true

# Trainable product contract. Diagnostic/legacy sources cannot satisfy this.
training_objective: sft
composition_method: causal_timeline
require_verified_sources: false
allow_legacy_sources: false
strict_semantic_verification: true
strict_cf_replay: true
require_producer_attestation: true

# A single product uses world-level grouping to prevent entity/workflow leakage.
# Topology/source-family/domain-composition are exported as separate eval products.
split_strategy: world
split_seed: 42

# Caps are attempted, then rejected if unique workflow history does not grow.
length_buckets:
  "16k": 16000
  "32k": 32768
  "64k": 65536
eval_length_buckets: {}
query_timings: [first, late]
position_buckets: [front, middle, back]

# Absolute distance floors are release audits, not candidate-construction rules.
min_evidence_tokens:
  "64k": 22000
release_min_evidence_tokens:
  "16k": 8000
  "32k": 16000
  "64k": 22000
  "128k": 44000
  "256k": 80000

# A larger cap must add workflow-bearing content; unrelated public text cannot fill it.
min_internal_growth: 4096
max_generic_growth_share: 0.20
