schema_version: p1.2
data_product: worldlong_sft
n_worlds: 210
n_parallel: 3
n_pulses: 0
n_anchors: 16
extra_filler_worlds: 20
min_semantic_tokens: 800
train_ratio: 0.8
surface_min: 0.82
keep_one_position: true
domains: [company, researchlab, codeforge]
# Max caps. Do not invent weekly pulses or unique_prose to hit these.
length_buckets:
  "8k": 8000
  "16k": 16000
  "32k": 32000
eval_length_buckets:
  "64k": 64000
min_evidence_frac:
  "8k": 0.0
  "16k": 0.0
  "32k": 0.0
  "64k": 0.0
query_timings: ["first", "late"]
position_buckets: ["front", "middle", "back"]
backbone: Qwen3.5-4B
max_seq_len: 65536
sft_conditions: ["B1", "B2", "B3", "B4", "B5"]
train_framework: llamafactory
