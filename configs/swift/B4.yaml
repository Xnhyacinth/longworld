### CausalTwin B4 — full-parameter SFT (not LoRA). ms-swift + SP.
### cutoff 262144 is the Qwen3.5 native cap, not a fill. packing off.
model: Qwen/Qwen3.5-4B
use_hf: true
torch_dtype: bfloat16
tuner_type: full
freeze_llm: false
freeze_vit: true
freeze_aligner: true
add_non_thinking_prefix: true
loss_scale: ignore_empty_think

dataset:
  - data/sft/swift/B4.jsonl
load_from_cache_file: true
lazy_tokenize: true
packing: false
padding_free: true
use_logits_to_keep: false
max_length: 262144
dataset_num_proc: 8
dataloader_num_workers: 2
split_dataset_ratio: 0.0
eval_strategy: "no"

output_dir: data/sft/swift_B4
logging_steps: 5
save_steps: 100
save_total_limit: 2
report_to: wandb
run_name: longworld-B4-qwen35-4b
seed: 42

per_device_train_batch_size: 1
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
gradient_checkpointing: true
