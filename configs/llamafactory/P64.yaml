# Local P64 combined probe. Not production_eligible.
# Launch: GPUS=4,5,6,7 LONGWORLD_P64_MANIFEST=... LONGWORLD_P64_REPORT_TRUST=... \
#   bash scripts/train_llamafactory.sh P64
# Hyperparams match B5/TASKBANK; dataset aliases come from the signed snapshot.
model_name_or_path: Qwen/Qwen3.5-4B
model_revision: a7b0d22b993d71000cf2eadfb37222a67cee521e
trust_remote_code: false

stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/llamafactory/ds_z3_config.json

dataset_dir: __validated_p64_snapshot_required__
dataset: p64_finance_train,p64_codeforge_train
template: qwen3_5_nothink
cutoff_len: 262144
overwrite_cache: true
preprocessing_num_workers: 8
packing: false
neat_packing: false
train_on_prompt: false

output_dir: data/sft/lf_P64_local_probe
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
flash_attn: auto
gradient_checkpointing: true
ddp_timeout: 180000000
val_size: 0.0
