### B5w uses LLaMA-Factory v1's dataset-index sampler; JSON rows stay unique.
model: Qwen/Qwen3.5-4B
model_class: llm

kernel_config:
  name: auto

dist_config:
  name: deepspeed
  config_file: configs/llamafactory/ds_z3_config.json

train_dataset: data/sft/llamafactory/B5w.datasets.yaml

output_dir: data/sft/lf_B5w
micro_batch_size: 1
cutoff_len: 262144
learning_rate: 1.0e-5
num_train_epochs: 1
logging_steps: 5
save_steps: 100
save_total_limit: 2
bf16: true
enable_activation_checkpointing: true
seed: 42
