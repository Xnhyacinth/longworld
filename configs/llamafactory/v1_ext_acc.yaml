### LLaMA-Factory v1 SFT: Ulysses CP (SP=2) on 2 GPUs.
### dp=1, cp=2, micro=1, global_batch_size 16 => accum 16. Same GBS as ACC Table 1.
### Official LF blocks qwen3.5 SP; vendor check is a warning so we can try.
model: /workspace/wynckeliao/longworld/data/models/Qwen3.5-4B
trust_remote_code: false
model_class: llm
flash_attn: flash_attention_2

dist_config:
  name: fsdp2
  dcp_path: null

cp_mode: ulysses
cp_size: 2

train_dataset: configs/llamafactory/v1_data_acc.yaml

output_dir: data/sft/lf_ext_acc_sp2
micro_batch_size: 1
global_batch_size: 16
cutoff_len: 133120
learning_rate: 1.0e-5
max_steps: 680
bf16: true
enable_activation_checkpointing: true
batching_workers: 32
logging_steps: 5
save_steps: 100
save_total_limit: 2
seed: 42
